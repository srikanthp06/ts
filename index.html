<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Secure Bot</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f0f0f0; }
    #chat { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    .message { margin: 10px 0; }
    .user { color: blue; text-align: right; }
    .bot { color: green; text-align: left; }
  </style>
</head>
<body>
  <div id="chat">
    <h2>Secure Chat with GPT</h2>
    <div id="messages"></div>
    <input id="userInput" type="text" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const userMessage = input.value;
      input.value = "";

      appendMessage("You: " + userMessage, "user");

      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userMessage })
      });

      const data = await res.json();
      appendMessage("Bot: " + data.reply, "bot");
    }

    function appendMessage(text, role) {
      const msg = document.createElement("div");
      msg.className = "message " + role;
      msg.textContent = text;
      document.getElementById("messages").appendChild(msg);
    }
  </script>
</body>
</html>
